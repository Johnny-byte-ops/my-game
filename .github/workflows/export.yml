name: "godot-native-web-export"
on: [push]

jobs:
  build-game:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Linux Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y wget unzip

      - name: Download Godot Engine & Templates (v4.7.2)
        run: |
          # Fetch directly from the official GitHub release binary distribution assets
          wget https://github.com
          unzip Godot_v4.7.2-stable_linux.x86_64.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          wget https://github.com
          unzip Godot_v4.7.2-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.7.2.stable/

      - name: Create Web Build Folder
        run: mkdir -p build/web

      - name: Compile Game to Web
        run: |
          ./godot --headless --audio-driver Dummy --display-driver Headless --export-release "Web" build/web/index.html

      - name: Upload Web Build Archive
        uses: actions/upload-artifact@v4
        with:
          name: game-web-build
          path: build/web/

